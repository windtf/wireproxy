name: Build container

on:
  push:
    branches:
      - master

  # Allow for manually running
  workflow_dispatch:
    inputs:
      container_tag:
        description: Tag for container
        default: "latest"
        required: true

permissions: {}

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      CONTAINER_NAME: ghcr.io/${{ github.repository }}
      BUILD_PLATFORMS: linux/amd64,linux/arm64
      RAW_CONTAINER_TAG: ${{ github.event.inputs.container_tag || 'latest' }}

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container
        run: |
          CONTAINER_TAG="${RAW_CONTAINER_TAG//[^a-zA-Z0-9]/-}"
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          PUSH_FLAG=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            PUSH_FLAG=(--push)
          fi

          docker buildx build \
            --platform "$BUILD_PLATFORMS" \
            --tag "$CONTAINER_NAME:$CONTAINER_TAG" \
            --tag "$CONTAINER_NAME:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$REPO_URL" \
            --label "org.opencontainers.image.documentation=$REPO_URL" \
            --label "org.opencontainers.image.url=$REPO_URL/packages" \
            --label "org.opencontainers.image.ref.name=$GITHUB_REF_NAME" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.vendor=$GITHUB_REPOSITORY_OWNER" \
            --label "org.opencontainers.image.created=$(date -u --rfc-3339=seconds)" \
            --pull "${PUSH_FLAG[@]}" .
